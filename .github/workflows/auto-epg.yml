name: auto update

on:
  schedule:
  # Verified via https://crontab.guru/ for 1,7,12,18 Beijing time (UTC+8)
  - cron: "0 17,23,4,10 * * *"
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - uses: actions/cache@v4
        if: startsWith(runner.os, 'Linux')
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set Timezone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: Update tv-guide
        run: python get-epg.py

      # guide.xml 只发布到独立的 epg 分支，每次以单提交覆盖推送。
      # main 的历史不再包含自动更新，其他文件的手动提交完整保留。
      - name: Publish guide.xml to epg branch (single-commit)
        run: |
          git config --local user.email "github-actions-bot@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          NEW_BLOB=$(git hash-object -w guide.xml)
          EPG=$(git ls-remote origin refs/heads/epg | cut -f1)
          if [ -n "$EPG" ]; then
            git fetch -q --depth=1 origin refs/heads/epg
            if [ "$(git rev-parse FETCH_HEAD:guide.xml 2>/dev/null)" = "$NEW_BLOB" ]; then
              echo "guide.xml unchanged, skip push"
              exit 0
            fi
          fi
          TREE=$(printf '100644 blob %s\tguide.xml\n' "$NEW_BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "🚀 update tv-guide at $(date '+%Y-%m-%d %H:%M:%S')")
          git push --force origin "${COMMIT}:refs/heads/epg"
          echo "published guide.xml to epg branch"
